<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Locator App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>Locator App</h1>
    <h2>Enter a URL or IP address</h2>
</header>
<main class="page-wrapper">

    <form>


        <fieldset id="input">
            <label for="ip-or-url">Enter a URL or IP address</label>
            <input type="text" name="ip-or-url" id="ip-or-url">
        </fieldset>

        <fieldset id="csset">
            <label for="country" id="countryLabel">Country</label>
            <input type="text" name="country" id="country">
            <label for="countryCode" id="countryCodeLabel">Country Code</label>
            <input type="text" name="countryCode" id="countryCode">
            <label for="regionName" id="regionNameLabel">Region</label>
            <input type="text" name="regionName" id="regionName">
            <label for="city" id="cityLabel">City</label>
            <input type="text" name="city" id="city"  />
            <label for="zip" id="zipLabel">Postal code</label>
            <input type="text" name = "zip" id="zip"  />
            <label for="lat" id="latLabel">Latitude</label>
            <input type="text" name = "lat" id="lat"  />
            <label for="lon" id="lonLabel">Longitude</label>
            <input type="text" name = "lon" id="lon"  />
            <label for="timezone" id="timezoneLabel">Timezone</label>
            <input type="text" name = "timezone" id="timezone"  />
            <label for="isp" id="ispLabel">ISP</label>
            <input type="text" name = "isp" id="isp"  />
            <label for="org" id="orgLabel">Organization</label>
            <input type="text" name = "org" id="org"  />
            <label for="asn" id="asnLabel">ASN</label>
            <input type="text" name = "asn" id="asn"  />
            <label for="flag-img" id="flagsLabel">Flag:</label>
            <div id="flag-img"></div>
        </fieldset>
    </form>
</main>
<script src="js/script.js"></script>
<footer>
    <p>&copy; 2026 Locator App, Created by Tom Lee</p>
</footer>
</body>

</html>
